name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux (VPS-side scripts)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests
        run: python3 -W error::ResourceWarning -m unittest discover -s tests -v

  macos:
    name: macOS (launcher and process guard, system Python)
    runs-on: macos-14
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests
        run: /usr/bin/python3 -W error::ResourceWarning -m unittest discover -s tests -v
